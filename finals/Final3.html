<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Final 3 Cadao OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{font-family:'Montserrat',Arial,sans-serif;color:#006e21;margin:0} main{max-width:900px;margin:2rem auto;padding:1rem;padding-bottom:5rem}</style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <h1 id="page-title">Final 3: DHCP (Joining Workstations)</h1>

    <div class="ratio ratio-16x9" id="video-embed">
      <!-- paste YouTube iframe here -->
      <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video" allowfullscreen></iframe>
    </div>

    <section id="description" style="margin-top:1.25rem">
      <h4>Notes / Description</h4>
      <p>For Final 3, we are covering DHCP concepts and exam preparation. This covers DHCP server configuration and workstation joining in Windows Server.</p>
    </section>
  </main>

  <div id="site-footer"></div>

  <script>
    fetch('../header.html').then(r=>r.text()).then(t=>{
      document.getElementById('site-header').innerHTML = t;
      const init = document.getElementById('site-header').querySelector('#header-init');
      if(init){ const s = document.createElement('script'); s.text = init.textContent; document.body.appendChild(s); }
    });
    fetch('../footer.html').then(r=>r.text()).then(t=>document.getElementById('site-footer').innerHTML=t);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
