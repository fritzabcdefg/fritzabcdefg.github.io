<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home - Operating Systems</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{font-family:'Montserrat',Arial,sans-serif;background:#fff;color:#006e21;margin:0} main{padding-bottom:4.5rem}</style>
</head>
<body>
  <div id="site-header"></div>
  <main class="container" style="max-width:900px;margin:2rem auto;padding:1rem">
    <h2>Redirecting to Home...</h2>
    <p>If you are not redirected automatically, <a href="home.html">click here to go to the site index</a>.</p>
  </main>
  <div id="site-footer"></div>
  <script>
    fetch('header.html').then(r=>r.text()).then(t=>{
      document.getElementById('site-header').innerHTML = t;
      const init = document.getElementById('site-header').querySelector('#header-init');
      if(init){ const s = document.createElement('script'); s.text = init.textContent; document.body.appendChild(s); }
    });
    fetch('footer.html').then(r=>r.text()).then(t=>document.getElementById('site-footer').innerHTML=t);
    setTimeout(()=>location.href='index.html',800);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
