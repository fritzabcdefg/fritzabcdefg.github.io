<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Windows 7 Installation Cadao OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <h1 id="page-title">Windows 7 Installation</h1>

    <div class="ratio ratio-16x9" id="video-embed">
      <!-- paste YouTube iframe here -->
<iframe width="560" height="315" src="https://www.youtube.com/embed/13S6IhF4hMM?si=9pLkTREct71DLMze" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>    <section id="description" style="margin-top:1.25rem">
    </div>

    <section id="description" style="margin-top:1.25rem">
      <h4>Description</h4>
      <p>Type any notes or description here. This paragraph remains visible and scrollable below the video.</p>
    </section>
  </main>

  <div id="site-footer"></div>

  <script>
    fetch('../header.html').then(r=>r.text()).then(t=>{
      document.getElementById('site-header').innerHTML = t;
      const init = document.getElementById('site-header').querySelector('#header-init');
      if(init){ const s = document.createElement('script'); s.text = init.textContent; document.body.appendChild(s); }
    });
    fetch('../footer.html').then(r=>r.text()).then(t=>document.getElementById('site-footer').innerHTML=t);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts.js"></script>
</body>
</html>
