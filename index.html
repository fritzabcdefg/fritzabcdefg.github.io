<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #333;
      color: #fff;
      height: 100vh;
      position: fixed;
      padding-top: 20px;
    }
    .sidebar a {
      display: block;
      color: #fff;
      padding: 12px;
      text-decoration: none;
    }
    .sidebar a:hover {
      background: #575757;
    }
    /* Main content */
    .content {
      margin-left: 220px;
      padding: 20px;
      flex: 1;
    }
    iframe {
      width: 100%;
      height: 315px;
      margin-bottom: 20px;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>My Portfolio</h2>
    <a href="#about">About Me</a>
    <a href="#projects">Projects</a>
    <a href="#videos">Videos</a>
    <a href="#contact">Contact</a>
  </div>

  <!-- Content -->
  <div class="content">
    <section id="about">
      <h1>About Me</h1>
      <p>Welcome to my portfolio! I’m showcasing my work and videos here.</p>
    </section>

    <section id="projects">
      <h1>Projects</h1>
      <p>Details about your projects go here.</p>
    </section>

    <section id="videos">
      <h1>My YouTube Videos</h1>
      <!-- Embed YouTube videos -->
      <iframe src="https://www.youtube.com/embed/VIDEO_ID_1" allowfullscreen></iframe>
      <iframe src="https://www.youtube.com/embed/VIDEO_ID_2" allowfullscreen></iframe>
      <iframe src="https://www.youtube.com/embed/VIDEO_ID_3" allowfullscreen></iframe>
    </section>

    <section id="contact">
      <h1>Contact</h1>
      <p>Email: yourname@example.com</p>
    </section>
  </div>
</body>
</html>
